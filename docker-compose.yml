x-app-base: &app-base
  image: support_ticket_portal_app
  volumes:
    - ./SupportTicketPortal:/var/www
    - ./SupportTicketPortal/.env:/var/www/.env
  depends_on:
    - mysql
    - redis
  networks:
    - laravel

services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    <<: *app-base
    container_name: support_ticket_portal_app
    command: php-fpm

  nginx:
    image: nginx:alpine
    container_name: support_ticket_portal_nginx
    ports:
      - "8000:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./SupportTicketPortal:/var/www
    depends_on:
      - app
    networks:
      - laravel

  mysql:
    image: mysql:8.0
    container_name: support_ticket_portal_mysql
    environment:
      MYSQL_DATABASE: support_ticket_portal
      MYSQL_USER: SupportTicketPortal
      MYSQL_PASSWORD: PrisonFlag308
      MYSQL_ROOT_PASSWORD: PrisonFlag308
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - laravel

  redis:
    image: redis:alpine
    container_name: support_ticket_portal_redis
    ports:
      - "6379:6379"
    networks:
      - laravel

  queue:
    <<: *app-base
    container_name: support_ticket_portal_queue
    depends_on:
      - redis
    command: php artisan queue:work redis --sleep=3 --tries=3 --timeout=90
    restart: always

  scheduler:
    <<: *app-base
    container_name: support_ticket_portal_scheduler
    depends_on:
      - app
    environment:
      TZ: Asia/Yangon # <-- ensures container uses Yangon timezone
    command: >
      sh -c "while true; do
        php artisan schedule:run --verbose;
        sleep 60;
      done"
    restart: always

networks:
  laravel:

volumes:
  mysql_data:
